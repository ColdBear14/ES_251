        <li><a href="#control-box"><i class="fas fa-cogs"></i> Control Box</a></li>
        <li><a href="#sensor-box"><i class="fas fa-thermometer-half"></i> Sensor Box</a></li>
    </ul>
    </ul>
</div>

    <!-- Box cho các giá trị cảm biến -->
    <div class="box" id = "sensor-box">
        <h2>Sensor Box</h2>
        <div>Temperature: <span id="sensorValue1"></span> °C </div>
        <div>Humidity: <span id="sensorValue2"></span> % </div>
        <div>Lux: <span id="sensorValue3"></span> Lux</div>
        <div>Soil Humidity: <span id="sensorValue4"></span> % </div>
        <div>Distance: <span id="sensorValue5"></span> cm </div>
    </div>

    <div class="sensor-container">
        <div class="sensor-box">
            <h3>Temperature</h3>
            <div class="sensor-content">
                <div class="sensor-value">
                    <span id="sensorValue1"></span> °C
                </div>
                <div class="sensor-settings">
                        <div class="name-setting">
                            <label for="sensorName1">Name :</label>
                            <input type="text" id="sensorName1" value="Temperature">
                        </div>
                        <div class="period-setting">
                        <label for="sensorPeriod1">Send period (s):</label>
                        <input type="number" id="sensorPeriod1" min="1" value="5">
                    </div>
                    <button onclick="updateSensorSettings(1)">Save Settings</button>
                </div>
            </div>
        </div>

        <div class="sensor-box">
            <h3>Humidity</h3>
            <div class="sensor-content">
                <div class="sensor-value">
                    <span id="sensorValue2"></span> % 
                </div>
                    <div class="sensor-settings">
                        <div class="name-setting">
                            <label for="sensorName2">Name :</label>
                            <input type="text" id="sensorName2" value="Humidity">
                        </div>
                        <div class="period-setting">
                            <label for="sensorPeriod2">Send period (s):</label>
                            <input type="number" id="sensorPeriod2" min="1" value="5">
                    </div>
                    <button onclick="updateSensorSettings(2)">Save Settings</button>
                </div>
            </div>
        </div>


    <script src="js/script.js"></script>
</body>
</html>
